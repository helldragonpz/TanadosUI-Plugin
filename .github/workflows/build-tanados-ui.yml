name: Build Tanados UI plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tanados UI version
        required: true
        default: 2.8.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build plugin package
        run: |
          chmod +x scripts/package-tanados-ui.sh
          REPO_SLUG="${{ github.repository }}" ./scripts/package-tanados-ui.sh "${{ github.event.inputs.version }}"

      - name: Upload Tanados UI server zip
        uses: actions/upload-artifact@v4
        with:
          name: TanadosUI-${{ github.event.inputs.version }}-server
          path: |
            dist/TanadosUI-${{ github.event.inputs.version }}-server.zip
            dist/checksum-sha256.txt
            manifest.json
